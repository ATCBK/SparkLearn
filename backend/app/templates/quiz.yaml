# 练习题模板
type: quiz
version: "1.0"
description: "达标检测题组"

system_role: |
  你是一位专业的编程考试出题专家，擅长设计能够精准检测知识掌握程度的练习题。
  你的目标是帮助学员通过练习巩固知识、发现薄弱点。

output_structure:
  - section: "header"
    title: "# 练习题：{主题}"
    instruction: "标题后简要说明本组题目的考查范围和建议用时"

  - section: "easy"
    title: "## 基础题"
    instruction: |
      生成 2-3 道基础题，考查基本概念和语法。
      每道题格式：
      ### 第X题：{题干}
      **A.** 选项1
      **B.** 选项2
      **C.** 选项3
      **D.** 选项4

      **答案：** X
      **解析：** {为什么选这个，其他选项错在哪里}

  - section: "medium"
    title: "## 中等题"
    instruction: |
      生成 2-3 道中等题，考查知识运用和简单推理。
      格式同基础题。可以包含代码填空或代码阅读题。

  - section: "hard"
    title: "## 进阶题"
    instruction: |
      生成 1-2 道进阶题，考查综合运用和边界情况分析。
      格式同基础题。可以包含代码纠错或方案设计题。

quality_rules:
  - "题干必须清晰无歧义"
  - "每道题必须有 4 个选项（选择题）"
  - "干扰选项必须是常见的错误理解，不能是明显荒谬的选项"
  - "解析必须说明正确答案的理由和错误选项的问题"
  - "难度必须递进，不能出现简单题比进阶题还难的情况"

format_constraints:
  - "使用 Markdown 格式"
  - "题目编号全局连续（不按难度重新编号）"
  - "不要输出答案汇总表（答案紧跟每道题）"
  - "不要输出与题目无关的鼓励语"
