events {}

http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=ai:10m rate=8r/m;

  upstream sparklearn_frontend {
    server 127.0.0.1:3000;
  }

  upstream sparklearn_backend {
    server 127.0.0.1:8000;
  }

  server {
    listen 80;
    server_name sparklearn.cn www.sparklearn.cn 121.41.78.3 _;

    client_max_body_size 50m;

    location ~ /\.(?!well-known) {
      return 404;
    }

    location ~* ^/(actuator|cgi-bin|vendor|wp-admin|wp-login|phpmyadmin|manage|admin/index\.html|login\.jsp|login\.html) {
      return 404;
    }

    location ~* /(config|backup|dump|database|\.env|env\.|id_rsa|composer\.(json|lock)|package-lock\.json)$ {
      return 404;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(tutor/chat|resources/generate|video|path-planning|profile/history/analyze|voice/tts|num-person/chat|agent/) {
      limit_req zone=ai burst=8 nodelay;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
      proxy_pass http://sparklearn_backend;
    }

    location = /health {
      proxy_pass http://sparklearn_backend;
    }

    location /api/ {
      limit_req zone=api burst=120 nodelay;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_pass http://sparklearn_backend;
    }

    location / {
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_pass http://sparklearn_frontend;
    }
  }
}
