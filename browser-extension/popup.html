<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SparkLearn 网页资料采集</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <div class="logo">S</div>
        <div>
          <h1>SparkLearn 采集</h1>
          <p>保存当前网页到个人资源中心</p>
        </div>
      </header>

      <label class="field">
        <span>后端地址</span>
        <input id="apiBase" placeholder="http://127.0.0.1:8000" />
      </label>

      <section id="loginPanel" class="auth-panel">
        <label class="field">
          <span>登录手机号</span>
          <input id="phone" inputmode="numeric" autocomplete="username" placeholder="请输入 SparkLearn 手机号" />
        </label>
        <label class="field">
          <span>登录密码</span>
          <input id="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" />
        </label>
        <button id="loginBtn">登录并连接账号</button>
      </section>

      <section id="accountPanel" class="account-panel" hidden>
        <div>
          <span>当前账号</span>
          <b id="accountName"></b>
        </div>
        <button id="logoutBtn" class="text-button">退出</button>
      </section>

      <button id="captureBtn" disabled>抓取并保存到资源中心</button>
      <p id="status" class="status">请先登录 SparkLearn。</p>

      <section id="result" class="result" hidden>
        <b id="resultTitle"></b>
        <span id="resultMeta"></span>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
