<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SparkLearn 正在加载</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 18%, rgba(40, 132, 255, 0.14), transparent 28%),
        radial-gradient(circle at 78% 76%, rgba(36, 176, 124, 0.16), transparent 30%),
        #f7f4ee;
      color: #172033;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    main {
      width: min(520px, calc(100vw - 48px));
      text-align: center;
    }

    img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      margin-bottom: 22px;
      filter: drop-shadow(0 14px 24px rgba(23, 32, 51, 0.14));
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
    }

    p {
      margin: 12px 0 28px;
      color: #5f6f86;
      font-size: 15px;
      line-height: 1.7;
    }

    .bar {
      width: 100%;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(23, 32, 51, 0.1);
    }

    .bar span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2563eb, #13a66b);
      animation: loading 1.4s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(250%);
      }
    }
  </style>
</head>
<body>
  <main>
    <img src="../assets/icon.png" alt="SparkLearn" />
    <h1>SparkLearn 正在加载</h1>
    <p>正在连接个性化学习平台，请稍候。</p>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
